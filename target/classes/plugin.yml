name: KoriaShop
version: 1.0.0
main: fr.koriamc.shop.KoriaShop
author: KoriaMC
description: Shop KoriaMC : achat et vente au serveur, tout vendre (Spigot 1.8.8)
depend: [Vault]
softdepend: [KoriaQuest, KoriaKrebbs]

commands:
  shop:
    description: Shop du serveur
    aliases: [boutique-jeu, magasin]
    usage: /shop [catégorie|reload]
  sell:
    description: Vendre au shop (coffre, main, tout l'inventaire)
    aliases: [vendre]
    usage: /sell [hand|all]

permissions:
  koriashop.sell.all:
    description: /sell all (vendre tout l'inventaire d'un coup)
    default: true
  koriashop.admin:
    description: /shop reload
    default: op
